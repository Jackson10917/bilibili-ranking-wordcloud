[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bilibili-ranking-wordcloud"
version = "0.1.0"
description = "抓取B站全站排行榜并生成多语言词频与词云"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "jieba>=0.42,<1",
  "requests>=2.31,<3",
  "stopwordsiso>=0.7,<1",
  "urllib3>=1.26,<3",
  "wordcloud>=1.9,<2",
]

[project.scripts]
bilibili-rank = "bilibili_ranker.cli:main"

[project.optional-dependencies]
test = ["pytest>=7,<9"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bilibili_ranker = [
  "resources/stopwords/*.txt",
  "resources/stopwords/*.md",
]
