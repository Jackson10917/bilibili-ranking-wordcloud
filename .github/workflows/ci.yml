name: CI

on:
  # push 只收 main：否则同仓库 PR 会同时触发 push 和 pull_request，16 个 job 白跑两遍。
  # concurrency 拦不住这种重复——两类事件的 github.ref 不同（refs/heads/x vs
  # refs/pull/N/merge），group 不同就不会互相取消。
  push:
    branches: [main]
  pull_request:

# 同一分支/PR 连续推送时取消上一轮未跑完的 job。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # 没有 CJK 字体，test_wordcloud_renders_real_png 会 skip，真实 PNG 保存路径零覆盖。
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest tests

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # 版本钉在 pyproject 的 lint extra，本地与 CI 用同一个 ruff。
      - run: python -m pip install -e ".[lint]"
      - run: ruff check .
      - run: ruff format --diff .
