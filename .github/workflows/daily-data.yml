name: Daily data

# 每天抓一次榜，把时间戳快照与累计词云提交回 data/——--aggregate 的跨天累计
# 靠这个目录里的日积月累闭环，本地固定 --output-dir 手动日跑同样有效。
on:
  schedule:
    - cron: "0 1 * * *" # UTC 01:00 = 北京时间 09:00
  workflow_dispatch:

# 快照与累计词云要提交回仓库，写权限只在此工作流开启；GITHUB_TOKEN 的推送
# 不会触发 CI 的 push 事件，无需担心自激。
permissions:
  contents: write

concurrency:
  group: daily-data
  cancel-in-progress: true

jobs:
  fetch-and-aggregate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: python -m pip install -e .
      - run: python -m bilibili_ranker --output-dir data
      # 快照刚落盘，离线重渲染即可；再抓一次榜是无谓的重复请求。
      - run: python -m bilibili_ranker --output-dir data --aggregate --no-fetch
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "没有新增数据，跳过提交"
          else
            git commit -m "data: 每日榜单快照与累计词云 $(date -u +%F)"
            git push
          fi
